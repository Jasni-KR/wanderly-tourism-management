{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Destination</title>
  <link rel="stylesheet" href="{% static 'css/choosing.css' %}">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  
</head>
<body>
   
  <div class="destination-container">
    <form action="{% url 'choose_destination' %}" method="POST" class="destination-form">
      {% csrf_token %}
        <h1 >Plan Your Journey</h1>
        <p class="intro">Choose your next adventure with ease.</p>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required placeholder="Enter your name">

      <label for="num-persons">Number of Persons:</label>
      <input type="number" id="num-persons" name="num_persons" required min="1" placeholder="Enter number of persons">

      <label for="destination">Choose Destination:</label>
      <select id="destination" name="destination" required>
        <option value="">Select a destination</option>
        <option value="paris">Paris</option>
        <option value="rome">Rome</option>
        <option value="london">USA</option>
        <option value="london">Japan</option>
        <option value="london">Malaysia</option>
        <option value="london">Australia</option>
        <!-- Add more options as needed -->
      </select>

      <button type="submit">Book Now</button>
    </form>
  </div>
  
</body>
</html>
