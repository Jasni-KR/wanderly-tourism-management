{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event List</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet"><!-- Link to your CSS file -->
    <style>
        body {
            font-family: 'Montserrat', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            font-size: 2em;
            font-weight: 600;
            color: #333;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 3px solid #86B817;
            padding-bottom: 0.2em;
            margin-bottom: 1em;
            
        }

        .event-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }

        .event-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 360px;
            text-align: center;
        }

        .event-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .event-card h2 {
            margin: 15px 0;
            font-size: 1.5em;
            color: #000;
        }

        .event-card p {
            margin: 10px;
            color: #555;
        }

        .event-card h3 {
            color: #28a745;
            margin: 10px 0;
        }

        .event-card button {
            background-color: #86B817;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .event-card button:hover {
            background-color: #218838;
        }

        .button-link {
            display: inline-block;
            text-decoration: none; /* Removes underline */
            color: inherit; /* Ensures the color is inherited */
        }

        .book-button {
            display: inline-block;
            text-decoration: none; /* Removes underline */
            border: none; /* Ensures no border */
        }
        
        
        
    </style>
</head>
<body>
    <h1>Upcoming Events</h1>
    <div class="event-container">
    {% for event in events %}
    <div class="event-card">
        <img src="{{ event.image.url }}" alt="{{ event.name }}">
        <h2>{{ event.name }}</h2>
        <p><strong>Location:</strong> {{ event.location }}</p>
        <p><strong>Duration:</strong> {{ event.duration }}</p>
        <p><strong>Capacity:</strong> {{ event.capacity }} persons</p>
        <h3>${{ event.price }}</h3>
        <p>{{ event.description }}</p>
        
        <a href="{% url 'book_event' event.id %}"class="book-button">
        <button>Book Now</button>
    </div>
    {% endfor %}
</body>
</html>
