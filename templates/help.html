<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #86B817;
        }
        p {
            margin: 10px 0;
            color: #555;
        }
        ul {
            margin: 10px 20px;
        }
        a {
            text-decoration: none;
            color: #86B817;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Help Center</h1>
        <p>Welcome to the Help Center! Here you can find answers to common issues.</p>
        <ul>
            <li>For technical support, contact our <a href="mailto:supportteam@gmail.com">Support Team</a>.</li>
            <li>Check our <a href="{% url 'faq' %}">FAQs</a> for quick solutions.</li>
            <li>Review our <a href="{% url 'Terms' %}">Terms & Conditions</a> for guidelines.</li>
        </ul>
    </div>
</body>
</html>
