{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <style>
        body {
           
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            position: relative;
        }

        /* Overlay for light shade effect */
        
       

        .login-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 6px rgba(0, 0, 0);
            width: 100%;
            max-width: 400px;
        }

        .login-container h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #333333;
        }

        .login-container form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid grey;
            border-radius: 5px;
            font-size: 16px;
        }

        .login-container form button {
            width: 100%;
            padding: 10px;
            background-color: #86B817; /* Green color */
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .login-container form button:hover {
            background-color: green; /* Slightly darker green */
        }

        .login-container a {
            display: block;
            text-align: center;
            margin-top: 10px;
            color: #86B817;
            text-decoration: none;
        }

        .login-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>USER LOGIN</h1>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <a href="/register/">Don't have an account? Register</a>
    </div>
</body>
</html>
